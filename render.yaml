services:
  - type: web
    name: habitflowai-api
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: habitflowai
      - key: FRONTEND_ORIGIN
        sync: false
      - key: BOOTSTRAP_ADMIN_KEY
        sync: false
      # Public read-only demo: seeds/refreshes the demo dataset at startup and
      # maps X-Demo-Mode requests to the fixed demo identity (writes rejected).
      # See docs/DEMO_ARCHITECTURE.md.
      - key: PUBLIC_DEMO_ENABLED
        value: "true"
      # Web Push habit reminders. The scheduler is an in-process 60s timer, so
      # it only fires reliably on an always-on instance (no idle sleep). Keys
      # via: npx web-push generate-vapid-keys — rotating them invalidates all
      # existing device subscriptions.
      - key: PUSH_REMINDERS_ENABLED
        value: "false"
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
